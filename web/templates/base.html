<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Infra Dropbox{% endblock %}</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/admin.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/messages.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/files.css') }}"
    />
  </head>

  <body>
    <main class="container">
      <header class="site-header">
        <a href="/" class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
          </span>
          Infra Dropbox
        </a>

        <div class="header-status">
          <span class="network-pill">
            <span class="network-dot" aria-hidden="true"></span>
            Local network
          </span>
          <span
            id="connection-status"
            class="connection-badge"
            role="status"
            aria-live="polite"
            hidden
          ></span>
        </div>
      </header>

      {% block content %}{% endblock %}

      <footer class="footer">
        <span class="footer-dot" aria-hidden="true"></span>
        Local network only &mdash; Fast &amp; private sharing
      </footer>
    </main>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
    {% block page_scripts %}{% endblock %}
  </body>
</html>

{% extends "base.html" %}

{% block title %}Infra Dropbox &middot; Messages{% endblock %}

{% block page_styles %}
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/messages.css') }}"
  />
{% endblock %}

{% block content %}
  <section class="section">
    <div class="section-heading">
      <h1>Messages</h1>
      <span class="message-count" id="message-count" aria-live="polite"
        >0 messages</span
      >
    </div>

    <div class="search-row">
      <label class="field-label" for="message-search">Search</label>
      <input
        id="message-search"
        class="search-input"
        type="search"
        placeholder="Filter messages"
        autocomplete="off"
      />
    </div>

    <p class="admin-status" id="message-status" role="status"></p>

    <div id="messages" class="messages">
      <div class="empty-state">Loading...</div>
    </div>
  </section>
{% endblock %}

{% block page_scripts %}
  <script src="{{ url_for('static', filename='js/messages.js') }}"></script>
{% endblock %}

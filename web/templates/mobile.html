<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101820" />
    <title>Infra Dropbox · Quick message</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/mobile.css') }}"
    />
  </head>
  <body{% if message or error %} class="show-message-input"{% endif %}>
    <main class="mobile-page">
      <header class="mobile-header">
        <h1>Infra Dropbox</h1>
      </header>

      <section>
        <form
          action="{{ url_for('pages.mobile') }}"
          method="post"
          id="mobile-form"
        >
          <div class="message-entry" id="message-entry">
            <label for="mobile-message">Message</label>
            <textarea
              id="mobile-message"
              name="message"
              maxlength="{{ max_message_length }}"
              rows="4"
            >{{- message -}}</textarea>
          </div>
          <div class="button-row">
            <button type="button" id="paste-button">Paste</button>
            <button type="submit" class="send-button">Send</button>
          </div>
          <p
            id="mobile-status"
            class="status{% if error %} error{% endif %}"
            role="status"
            aria-live="polite"
          >{% if error %}{{ error }}{% elif sent %}Message sent.{% endif %}</p>
          <noscript>
            <p class="hint">Enter text in the message box, then press Send.</p>
          </noscript>
        </form>
      </section>
    </main>
    <script src="{{ url_for('static', filename='js/mobile.js') }}"></script>
  </body>
</html>
